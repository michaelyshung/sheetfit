name: installers

# Builds the app + command-line tool as a Windows installer (.exe), macOS
# disk images (.dmg, Apple silicon and Intel) and a Debian/Ubuntu package
# (.deb). Run it by hand from the Actions tab (files appear as run
# artifacts), or push a tag like v0.7.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, kind: deb }     # older glibc: runs on Ubuntu 22.04+ / Debian 12+
          - { os: windows-latest, kind: exe }
          - { os: macos-latest, kind: dmg }     # Apple silicon
          - { os: macos-15-intel, kind: dmg }   # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt libraries to bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller

      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import sheetfit; print(sheetfit.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --log-level WARN packaging/sheetfit.spec

      - name: Smoke test the bundle
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = macOS ]; then dir=dist/sheetfit.app/Contents/MacOS; else dir=dist/sheetfit; fi
          "$dir/sheetfit" --version
          python -c "import sys; sys.path.insert(0, 'tests'); from test_pipeline import music_page; music_page().save('smoke.png')"
          "$dir/sheetfit" smoke.png -o smoke.pdf
          test -s smoke.pdf
          if [ "$RUNNER_OS" = Linux ]; then
            # the app should start and keep running (exit 124 = killed by timeout)
            set +e; timeout 10 "$dir/sheetfit-app" smoke.png; rc=$?; set -e
            [ $rc -eq 124 ] || { echo "app exited with $rc"; exit 1; }
          fi

      - name: Package (.deb)
        if: matrix.kind == 'deb'
        run: packaging/build_deb.sh

      - name: Package (.dmg)
        if: matrix.kind == 'dmg'
        run: packaging/build_dmg.sh

      - name: Package (Windows installer)
        if: matrix.kind == 'exe'
        shell: pwsh
        run: |
          $v = python -c "import sheetfit; print(sheetfit.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$v" packaging\sheetfit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: sheetfit-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "sheetfit ${GITHUB_REF_NAME#v}" --generate-notes
