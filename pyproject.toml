[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetfit"
dynamic = ["version"]
description = "Straighten, dewarp, clean and fit photos of sheet music to Letter/A4 pages for printing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "Pillow>=9.1", "pillow-heif>=0.13"]
keywords = ["sheet music", "deskew", "dewarp", "scan", "pdf", "printing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Environment :: Console",
]

[project.scripts]
sheetfit = "sheetfit.core:main"

[tool.setuptools.dynamic]
version = { attr = "sheetfit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
